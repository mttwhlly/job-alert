# Watchlist of companies to poll for new job postings.
#
# Add a company by adding one line below:
#   - { name: "Display Name", ats: <greenhouse|lever|ashby|workable|smartrecruiters|rippling>, slug: <ats-specific-slug> }
#
# How to find the slug for each ats:
#   greenhouse:      the board URL job-boards.greenhouse.io/<slug>
#   lever:           the board URL jobs.lever.co/<slug>
#   ashby:           the board URL jobs.ashbyhq.com/<slug>
#   workable:        the board URL apply.workable.com/<slug>
#   smartrecruiters: the board URL careers.smartrecruiters.com/<slug>
#                    (not all SmartRecruiters companies expose the public API - it may 404)
#   rippling:        the board URL ats.rippling.com/<slug>/jobs
#                    (unofficial/scraped adapter, see src/adapters/rippling.py - only
#                    reliably sees the first ~20 open postings on that board)
#   mayo_clinic:     bespoke adapter, see src/adapters/mayo_clinic.py - not a generic
#                    ATS integration. Hardcoded to Jacksonville, FL postings (complete)
#                    plus a best-effort keyword search for "remote" postings (may miss
#                    remote roles that don't say "remote"). Slug is unused.

companies:
  - { name: "Wikimedia Foundation", ats: greenhouse, slug: wikimedia }
  - { name: "Help Scout", ats: ashby, slug: helpscout }
  - { name: "Figma", ats: greenhouse, slug: figma }
  - { name: "Mozilla", ats: greenhouse, slug: mozilla }
  - { name: "Code for America", ats: greenhouse, slug: codeforamerica }
  - { name: "Khan Academy", ats: greenhouse, slug: khanacademy }
  - { name: "AidKit", ats: ashby, slug: aidkit }
  - { name: "Bookshop.org", ats: workable, slug: bookshop-org }
  - { name: "Surfline", ats: rippling, slug: surfline }
  - { name: "Mayo Clinic", ats: mayo_clinic, slug: mayoclinic }
